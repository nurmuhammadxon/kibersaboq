# Ishlatish: serverda shu papkada `.env` fayl yarating (deploy.env.example dan nusxa)
# va: docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kibersaboq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kibersaboq
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kibersaboq"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${APP_URL}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kibersaboq:${POSTGRES_PASSWORD}@db:5432/kibersaboq
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # Bir martalik buyruqlar uchun (doim ishlab turmaydi):
  #   docker compose run --rm tools npx prisma migrate deploy
  tools:
    build:
      context: .
      target: builder
      args:
        NEXT_PUBLIC_APP_URL: ${APP_URL}
    profiles: ["tools"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kibersaboq:${POSTGRES_PASSWORD}@db:5432/kibersaboq
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
